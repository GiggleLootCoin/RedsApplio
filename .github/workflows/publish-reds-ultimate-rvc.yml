name: Publish Red's Ultimate RVC ❤️ to Hugging Face

on:
  workflow_dispatch:
  push:
    paths:
      - "reds-ultimate-rvc/**"
      - ".github/workflows/publish-reds-ultimate-rvc.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Hugging Face CLI
        run: python -m pip install --upgrade huggingface_hub

      - name: Create the ZeroGPU Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          hf repos create Giggle-Loot/Reds-Ultimate-RVC             --repo-type space             --space-sdk gradio             --flavor zero-a10g             --public             --exist-ok             --token "$HF_TOKEN"

      - name: Upload Red's Ultimate RVC ❤️
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload Giggle-Loot/Reds-Ultimate-RVC             ./reds-ultimate-rvc .             --repo-type space             --token "$HF_TOKEN"             --commit-message "Deploy Red's Ultimate RVC ❤️"
